services:
  - type: web
    name: agriculture-threat-fusion
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: COOKIE_SECURE
        value: "true"
      - key: AGRI_DATABASE_PATH
        value: backend/agriculture.sqlite3
