name: Train agriculture models

on:
  workflow_dispatch:
  push:
    branches:
      - fix/google-auth-and-real-datasets
    paths:
      - "backend/scripts/download_datasets.py"
      - "backend/scripts/train_crop_model.py"
      - "backend/scripts/train_disease_model.py"
      - "backend/app/ml_model.py"
      - ".github/workflows/train-models.yml"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Download crop and PlantVillage datasets
        run: python backend/scripts/download_datasets.py

      - name: Train crop recommendation model
        run: python backend/scripts/train_crop_model.py

      - name: Train plant disease model
        run: python backend/scripts/train_disease_model.py

      - name: Upload trained model files
        uses: actions/upload-artifact@v4
        with:
          name: agriculture-threat-fusion-models
          path: backend/models/*.joblib
          if-no-files-found: error
          retention-days: 14
